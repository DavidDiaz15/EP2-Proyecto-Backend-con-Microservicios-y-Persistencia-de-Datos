server:
  port: 8086

spring:
  application:
    name: detalle-pedido
  datasource:
    url: jdbc:mysql://localhost:3306/db_detalle_pedido?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enable: true
    repair: true
    baseline-on-migrate: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/