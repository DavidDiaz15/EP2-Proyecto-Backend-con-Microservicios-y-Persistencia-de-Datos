server:
  port: 8083

spring:
  application:
    name: productos

  datasource:
    url: jdbc:mysql://localhost:3306/db_productos?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password:
  flyway:
    enable: true
    repair: true
    baseline-on-migrate: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/